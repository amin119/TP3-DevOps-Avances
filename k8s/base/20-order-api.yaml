# Service A — order-api (Python FastAPI). Appelle pricing-engine en HTTP interne.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: perf-lab
  labels: { app: order-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-api }
  template:
    metadata:
      labels: { app: order-api }
    spec:
      containers:
        - name: order-api
          image: order-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: PRICING_URL, value: "http://pricing-engine.perf-lab.svc.cluster.local:8080/price" }
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits:   { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: perf-lab
  labels: { app: order-api }
spec:
  type: ClusterIP
  selector: { app: order-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
